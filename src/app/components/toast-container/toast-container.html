<div class="toast-wrapper position-fixed top-0 end-0 p-3" style="z-index: 2000;">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="toast-item d-flex align-items-center gap-3 px-4 py-3 rounded-4 shadow-lg mb-2"
         [ngClass]="{
           'toast-success': toast.type === 'success',
           'toast-info': toast.type === 'info',
           'toast-danger': toast.type === 'danger'
         }">
      <i class="bi fs-5" [ngClass]="{
        'bi-check-circle-fill text-success': toast.type === 'success',
        'bi-info-circle-fill text-primary': toast.type === 'info',
        'bi-exclamation-circle-fill text-danger': toast.type === 'danger'
      }"></i>
      <span class="small fw-medium">{{ toast.text }}</span>
      <button class="btn btn-link text-muted p-0 ms-auto text-decoration-none lh-1" (click)="toastService.remove(toast.id)">
        <i class="bi bi-x-lg small"></i>
      </button>
    </div>
  }
</div>
